name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node-checks:
    name: Node checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify

  macos-checks:
    name: macOS build and native tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:resources
      - run: npm run test:native
      - run: npm run build:macos
        env:
          VIDEO_FLOW_KEYS_UNSIGNED: "1"
