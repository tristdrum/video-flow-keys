<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Flow Keys</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Video Flow Keys</h1>
        <p>S/D/F/E for Safari video.</p>
      </header>

      <section class="controls" aria-label="Playback controls">
        <button type="button" data-command="slower">S</button>
        <button type="button" data-command="default">D</button>
        <button type="button" data-command="faster">F</button>
        <button type="button" data-command="skip">E</button>
      </section>

      <form id="settings-form">
        <label>
          <span>YouTube start speed</span>
          <input id="defaultRate" name="defaultRate" type="number" min="0.1" max="9.9" step="0.1">
        </label>

        <label>
          <span>Step</span>
          <input id="rateStep" name="rateStep" type="number" min="0.01" max="2" step="0.01">
        </label>

        <label class="checkbox">
          <input id="autoApplyDefaultOnYouTube" name="autoApplyDefaultOnYouTube" type="checkbox">
          <span>Apply default on YouTube</span>
        </label>

        <label class="checkbox">
          <input id="autoSkipYouTubeAds" name="autoSkipYouTubeAds" type="checkbox">
          <span>Auto-bypass YouTube ads</span>
        </label>

        <label class="checkbox">
          <input id="showHud" name="showHud" type="checkbox">
          <span>Show speed HUD</span>
        </label>
      </form>

      <section class="sponsors" aria-labelledby="sponsors-title">
        <h2 id="sponsors-title">YouTube sponsors</h2>
        <label class="checkbox">
          <input id="skipSponsors" name="skipSponsors" type="checkbox" form="settings-form">
          <span>Skip sponsors automatically</span>
        </label>
        <p>When enabled, video titles and captions are sent to TypeSafe using your key. Amber marks show sponsor likelihood. You can undo a skip.</p>
        <label class="key-label" for="typesafe-key">TypeSafe API key</label>
        <input id="typesafe-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your own key" aria-describedby="key-status">
        <div class="key-actions">
          <button id="save-key" type="button">Save key</button>
          <button id="remove-key" type="button" disabled>Remove</button>
        </div>
        <p id="key-status" role="status">Checking saved key…</p>
        <p id="analysis-status" role="status">Checking video…</p>
        <div class="key-actions">
          <button id="undo-sponsor" type="button" disabled>Undo last skip</button>
          <button id="retry-analysis" type="button">Try again</button>
        </div>
      </section>
    </main>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
